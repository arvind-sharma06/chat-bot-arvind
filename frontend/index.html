<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arvind's Bot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <h1>Arvind's Bot</h1>
        <p>B2B onboarding and integration assistant</p>
      </header>

      <main class="layout">
        <section class="panel chat-panel">
          <div id="messages" class="messages"></div>
          <div class="composer">
            <textarea id="userInput" placeholder="Ask about onboarding, integrations, configuration, access, or alerts..."></textarea>
            <button id="sendBtn">Send</button>
          </div>
        </section>

        <section class="panel settings-panel">
          <h2>Knowledge Base</h2>
          <input id="kbFiles" type="file" accept=".docx" multiple />
          <button id="uploadBtn">Upload KB Files</button>

          <label for="sourcePaths">Extra source paths (comma-separated)</label>
          <input id="sourcePaths" type="text" placeholder="/path/to/docx-or-folder" />
          <button id="reindexBtn">Rebuild Vector DB</button>

          <h2>Prompt & Model</h2>
          <label for="apiKey">Anthropic API key</label>
          <input id="apiKey" type="password" placeholder="sk-ant-..." />
          <small id="apiKeyState"></small>

          <label for="modelName">Model</label>
          <input id="modelName" type="text" />

          <label for="contextWindow">Context window turns</label>
          <input id="contextWindow" type="number" min="2" max="20" />

          <label for="topK">Top-K retrieval</label>
          <input id="topK" type="number" min="1" max="20" />

          <label for="threshold">Similarity threshold (lower = stricter)</label>
          <input id="threshold" type="number" step="0.01" min="0" max="2" />

          <label class="inline">
            <input id="enableImages" type="checkbox" /> Enable image understanding during indexing
          </label>

          <label for="systemPrompt">System prompt</label>
          <textarea id="systemPrompt" rows="10"></textarea>
          <button id="saveSettingsBtn">Save Settings</button>

          <div id="status" class="status"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
